<svg width="700" height="266" viewBox="0 0 700 266" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skill focus: Frontend Development 90 percent, DSA with JavaScript 65 percent, Backend Development 28 percent, Open Source 58 percent" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="b1" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#61DAFB"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="b2" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#F7DF1E"/><stop offset="1" stop-color="#FF9A3C"/></linearGradient>
    <linearGradient id="b3" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#3FB950"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <linearGradient id="b4" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <clipPath id="rd"><rect width="700" height="266" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#rd)">
    <rect width="700" height="266" fill="#1e1e1e"/>
    <rect x="0" y="0" width="700" height="1" fill="#000"/>
  </g>
  <rect x="0.5" y="0.5" width="699" height="265" rx="13.5" fill="none" stroke="#333844"/>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="24" y="34" font-size="14"><tspan fill="#89d185">➜</tspan><tspan fill="#61AFEF">  ~ </tspan><tspan fill="#d4d4d4">cat skills.sh</tspan></text>

    <text x="24" y="70" font-size="13" fill="#9da5b4">frontend_dev</text>
    <rect x="24" y="80" width="500" height="10" rx="5" fill="#2d2d2d"/>
    <rect x="24" y="80" width="0" height="10" rx="5" fill="url(#b1)">
      <animate attributeName="width" from="0" to="450" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="650" y="89" font-size="13" fill="#79c0ff" text-anchor="end">90%</text>

    <text x="24" y="116" font-size="13" fill="#9da5b4">dsa_javascript</text>
    <rect x="24" y="126" width="500" height="10" rx="5" fill="#2d2d2d"/>
    <rect x="24" y="126" width="0" height="10" rx="5" fill="url(#b2)">
      <animate attributeName="width" from="0" to="325" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="650" y="135" font-size="13" fill="#d7ba7d" text-anchor="end">65%</text>

    <text x="24" y="162" font-size="13" fill="#9da5b4">backend_dev</text>
    <rect x="24" y="172" width="500" height="10" rx="5" fill="#2d2d2d"/>
    <rect x="24" y="172" width="0" height="10" rx="5" fill="url(#b3)">
      <animate attributeName="width" from="0" to="140" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="650" y="181" font-size="13" fill="#7ee787" text-anchor="end">28%</text>

    <text x="24" y="208" font-size="13" fill="#9da5b4">open_source</text>
    <rect x="24" y="218" width="500" height="10" rx="5" fill="#2d2d2d"/>
    <rect x="24" y="218" width="0" height="10" rx="5" fill="url(#b4)">
      <animate attributeName="width" from="0" to="290" dur="1.1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </rect>
    <text x="650" y="227" font-size="13" fill="#f0a6ca" text-anchor="end">58%</text>

    <text x="24" y="252" font-size="12" fill="#6a737d"># frontend = current focus, backend = learning</text>
  </g>
</svg>
