<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal: whoami -> Amit Kumar, Frontend Developer. cat role.txt -> React, Redux Toolkit, Tailwind CSS, BCA Student. echo FOCUS -> Building responsive apps, learning DSA, growing into full-stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="900" height="380" rx="14"/></clipPath>
    <clipPath id="topround"><path d="M14,0 H886 a14,14 0 0 1 14,14 V44 H0 V14 a14,14 0 0 1 14,-14 Z"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61DAFB"/><stop offset="1" stop-color="#C586C0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="380" fill="#1e1e1e"/>
    <!-- title bar -->
    <g clip-path="url(#topround)">
      <rect width="900" height="44" fill="#2d2d2d"/>
    </g>
    <circle cx="26" cy="22" r="7" fill="#ff5f56"/>
    <circle cx="50" cy="22" r="7" fill="#ffbd2e"/>
    <circle cx="74" cy="22" r="7" fill="#27c93f"/>
    <text x="450" y="27" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#9da5b4">amit@dev — zsh</text>
    <rect x="0" y="44" width="900" height="1" fill="#000000"/>

    <!-- body -->
    <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17">

      <g opacity="0">
        <text x="30" y="95"><tspan fill="#89d185">➜</tspan><tspan fill="#61AFEF">  ~ </tspan><tspan fill="#d4d4d4">whoami</tspan></text>
        <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="30" y="129" fill="#d7ba7d">Amit Kumar — Frontend Developer</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="30" y="163"><tspan fill="#89d185">➜</tspan><tspan fill="#61AFEF">  ~ </tspan><tspan fill="#d4d4d4">cat role.txt</tspan></text>
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="30" y="197" fill="#4ec9b0">React · Redux Toolkit · Tailwind CSS · BCA Student</text>
        <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="30" y="231"><tspan fill="#89d185">➜</tspan><tspan fill="#61AFEF">  ~ </tspan><tspan fill="#d4d4d4">echo $FOCUS</tspan></text>
        <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.5s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="30" y="265" fill="#ce9178">"Building responsive apps, learning DSA, growing into full-stack"</text>
        <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.5s" fill="freeze"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.01s" fill="freeze"/>
        <text x="30" y="299"><tspan fill="#89d185">➜</tspan><tspan fill="#61AFEF">  ~ </tspan></text>
        <rect x="76" y="285" width="11" height="18" fill="#d4d4d4">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" begin="4.1s" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="url(#glow)" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
