<svg width="700" height="196" viewBox="0 0 700 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Focus areas: Frontend Development (Focus), DSA with JavaScript (Improving), Backend Development (Learning), Open Source (Contributing)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .label { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #24292f; }
    .tag   { font: 600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #57606a; letter-spacing: .4px; text-transform: uppercase; }
    .track { fill: #8b949e; fill-opacity: .25; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #e6edf3; }
      .tag   { fill: #9198a1; }
    }
  </style>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#61DAFB"/><stop offset="1" stop-color="#764ABC"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F7DF1E"/><stop offset="1" stop-color="#FF9A3C"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3FB950"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Row 1 : Frontend Development -->
  <text class="label" x="8" y="35">Frontend Development</text>
  <rect class="track" x="225" y="22" width="330" height="14" rx="7"/>
  <rect x="225" y="22" width="300" height="14" rx="7" fill="url(#g1)">
    <animate attributeName="width" from="0" to="300" dur="1.4s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>
  <text class="tag" x="575" y="34">Focus</text>

  <!-- Row 2 : DSA with JavaScript -->
  <text class="label" x="8" y="81">DSA with JavaScript</text>
  <rect class="track" x="225" y="68" width="330" height="14" rx="7"/>
  <rect x="225" y="68" width="224" height="14" rx="7" fill="url(#g2)">
    <animate attributeName="width" from="0" to="224" dur="1.4s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>
  <text class="tag" x="575" y="80">Improving</text>

  <!-- Row 3 : Backend Development -->
  <text class="label" x="8" y="127">Backend Development</text>
  <rect class="track" x="225" y="114" width="330" height="14" rx="7"/>
  <rect x="225" y="114" width="89" height="14" rx="7" fill="url(#g3)">
    <animate attributeName="width" from="0" to="89" dur="1.4s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>
  <text class="tag" x="575" y="126">Learning</text>

  <!-- Row 4 : Open Source -->
  <text class="label" x="8" y="173">Open Source</text>
  <rect class="track" x="225" y="160" width="330" height="14" rx="7"/>
  <rect x="225" y="160" width="195" height="14" rx="7" fill="url(#g4)">
    <animate attributeName="width" from="0" to="195" dur="1.4s" begin="0.75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>
  <text class="tag" x="575" y="172">Contributing</text>
</svg>
