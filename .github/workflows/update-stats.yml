name: Update Git Stats

on:
  schedule:
    - cron: "0 1 * * *"   # roz raat 1 baje (UTC)
  workflow_dispatch:       # Actions tab se manually run karne ke liye

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate stats SVGs
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/git-stats.svg assets/contrib-heatmap.svg assets/top-langs.svg
          git diff --cached --quiet || git commit -m "chore: update git stats [skip ci]"
          git push
